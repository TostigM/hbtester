schema_version: "0.1"
content_type: subclass
id: thief
display_name: Thief
source: PHB_2024
author: Wizards of the Coast
parent_class: rogue
tags: [utility, mobility, item_use]
complexity_rating: moderate
behavior_hints:
  preferred_action: ranged_sneak_attack
  positioning: stay_hidden_or_distant

features:
  - id: fast_hands
    display_name: Fast Hands
    feature_type: passive_feature_grant
    unlock_level: 3
    body:
      description: Cunning Action can also include Utilize Magic Item, Sleight of Hand check, or Thieves' Tools use

  - id: second_story_work
    display_name: Second-Story Work
    feature_type: passive_feature_grant
    unlock_level: 3
    body:
      description: Climbing costs no extra movement; add DEX modifier in feet to running long jump distance

  - id: supreme_sneak
    display_name: Supreme Sneak
    feature_type: passive_feature_grant
    unlock_level: 9
    body:
      description: Advantage on Stealth checks if you move no more than half your speed

  - id: use_magic_device
    display_name: Use Magic Device
    feature_type: passive_feature_grant
    unlock_level: 13
    body:
      description: Ignore class, race, and level requirements on magic items

  - id: thiefs_reflexes
    display_name: "Thief's Reflexes"
    feature_type: passive_feature_grant
    unlock_level: 17
    body:
      description: Take two turns in the first round of combat (first at initiative, second at initiative - 10)
