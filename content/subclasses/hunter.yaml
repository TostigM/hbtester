schema_version: "0.1"
content_type: subclass
id: hunter
display_name: Hunter
parent_class: ranger
source: PHB_2024
author: Wizards of the Coast
flavor: >
  You stalk prey with methodical precision, learning techniques to hunt
  even the most dangerous quarry. Hunters specialize in tactical superiority
  over single powerful foes or overwhelming hordes.
subclass_feature_levels: [3, 7, 11, 15]
features:
  # "Hunter's Prey: Choose Colossus Slayer, Giant Killer, or Horde Breaker."
  # Colossus Slayer: Once per turn, when you hit a creature with a weapon attack,
  # deal extra 1d8 damage if it's below its HP maximum. — PHB 2024
  - id: hunters_prey
    display_name: Hunter's Prey
    feature_type: passive_roll_modifier
    unlock_level: 3
    body:
      modifier_type: bonus_damage
      die_count: 1
      die_size: 8
      once_per_turn: true
      description: >
        Colossus Slayer: Once per turn, when you hit a creature below its HP
        maximum with a weapon attack, deal an extra 1d8 damage.

  # "Hunter's Lore: Choose two from Giant Killer's Instinct, Ethereal Step,
  # Volley, or Whirlwind Attack." — PHB 2024
  - id: hunters_lore
    display_name: Hunter's Lore
    feature_type: passive_feature_grant
    unlock_level: 7
    body:
      description: >
        Choose two combat techniques: Giant Killer (reaction attack when Large+
        creature misses you), Colossus Slayer upgrade, Volley (AoE arrow rain),
        or Whirlwind Attack (melee AoE).

  # "Superior Hunter's Prey: Choose one additional Hunter's Prey option or
  # Multiattack Defense (+4 AC when hit)." — PHB 2024
  - id: superior_hunters_prey
    display_name: Superior Hunter's Prey
    feature_type: passive_feature_grant
    unlock_level: 11
    body:
      description: >
        Multiattack Defense: When a creature hits you with an attack, gain +4
        AC against all subsequent attacks from that creature until your next turn.

  # "Superior Hunter's Defense: Evasion — Dex save for half becomes no damage;
  # fail becomes half." — PHB 2024
  - id: superior_hunters_defense
    display_name: Superior Hunter's Defense
    feature_type: passive_feature_grant
    unlock_level: 15
    body:
      description: >
        Evasion: When subjected to an effect requiring a DEX save for half
        damage, take no damage on success and half on failure.
