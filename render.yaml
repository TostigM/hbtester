services:
  - type: web
    name: hbtester-api
    runtime: python
    buildCommand: bash scripts/build.sh
    startCommand: bash scripts/start.sh
    envVars:
      - key: PYTHONPATH
        value: src
      - key: CONTENT_DIR
        value: content
      - key: BASELINES_DIR
        value: baselines/v1.3
      - key: MAX_RUNS
        value: "100"
